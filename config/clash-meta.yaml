# [INPUT]: providers payload 与 Clash Meta 兼容代理提供者 URL
# [OUTPUT]: 对外提供可直接导入的 Clash Meta 原生分流模板
# [POS]: config 的原生客户端方案；通用订阅应使用 GitHub Actions 生成完整配置
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info

proxy-providers:
  subscription:
    type: http
    url: https://example.invalid/clash.yaml
    path: ./proxy-providers/subscription.yaml
    interval: 21600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

